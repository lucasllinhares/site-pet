<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site Pet | Sites para clínicas e hospitais veterinários</title>
  <meta name="description" content="Coleção de sites para clínicas, hospitais veterinários e negócios pet." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --blue:#1f3d73; --green:#2a9d6f; --yellow:#ffb143; --beige:#fbf5ea; --ink:#2b2220; --text:#5f5752; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Nunito", system-ui, sans-serif; background: var(--beige); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    h1, h2 { font-family: "Fredoka", system-ui, sans-serif; color: var(--ink); line-height: 1.1; }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1100px, 100% - 32px); margin-inline: auto; }
    header { padding: 60px 0 40px; text-align: center; }
    .tag { display: inline-block; background: #dff3e9; color: var(--green); font-weight: 800; font-size: .85rem; padding: 6px 16px; border-radius: 99px; margin-bottom: 18px; }
    h1 { font-size: clamp(2.4rem, 6vw, 4rem); margin-bottom: 14px; }
    h1 span { color: var(--yellow); }
    header p { font-size: 1.1rem; max-width: 520px; margin-inline: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; padding-bottom: 60px; flex: 1; align-content: start; }
    .card { background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 14px 40px rgba(43,34,32,.09); transition: transform .4s cubic-bezier(.22,1,.36,1), box-shadow .4s; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-8px); box-shadow: 0 24px 60px rgba(31,61,115,.16); }
    .card__img { aspect-ratio: 16/10; overflow: hidden; background: var(--yellow); }
    .card__img img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.22,1,.36,1); }
    .card:hover .card__img img { transform: scale(1.06); }
    .card__body { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card__brand { display: flex; align-items: center; gap: 10px; }
    .card__brand img { height: 34px; }
    .card h2 { font-size: 1.4rem; }
    .card p { font-size: .95rem; flex: 1; }
    .card__link { margin-top: 10px; font-weight: 800; color: var(--green); display: inline-flex; gap: 6px; align-items: center; }
    .card:hover .card__link { gap: 10px; }
    .card__link { transition: gap .3s; }
    footer { background: var(--blue); color: rgba(255,255,255,.75); text-align: center; padding: 22px 0; font-size: .9rem; }
  </style>
</head>
<body>
  <header class="wrap">
    <span class="tag">🐾 Site Pet</span>
    <h1>Sites para quem <span>cuida de pets</span></h1>
    <p>Páginas criadas para clínicas, hospitais veterinários e negócios do mundo pet.</p>
  </header>

  <main class="wrap grid">
    <a class="card" href="/souvet/">
      <div class="card__img"><img src="/souvet/assets/img/hero-beagle.jpg" alt="Beagle sorrindo" /></div>
      <div class="card__body">
        <div class="card__brand"><img src="/souvet/assets/img/logo-icon.png" alt="" /><h2>Sou Vet</h2></div>
        <p>Hospital Veterinário 24h no Bessa, em João Pessoa - PB.</p>
        <span class="card__link">Ver site →</span>
      </div>
    </a>
  </main>

  <footer>© 2026 Site Pet</footer>
</body>
</html>
